version: 2
registries:
  gitlab:
    type: docker-registry
    url: https://registry.gitlab.com
    username: dusty-meg
    password: ${{secrets.GITLAB_REGISTRY_TOKEN}}
updates:
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
